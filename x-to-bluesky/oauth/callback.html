<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Finishing Bluesky sign-in</title>
    <style>
      body {
        background: #f6f8fb;
        color: #172033;
        display: grid;
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        place-items: center;
      }

      main {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgb(0 0 0 / 12%);
        max-width: 480px;
        padding: 28px;
        text-align: center;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 10px;
      }

      p {
        line-height: 1.5;
        margin: 0;
      }

      .error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Finishing Bluesky sign-in</h1>
      <p id="status">Returning authorization to the extension…</p>
    </main>

<script>
  const EXTENSION_ID = "obockckbdnphkagpakclcekbdlmiakld";
  const statusElement = document.querySelector("#status");

  function setStatus(message, isError = false) {
    statusElement.textContent = message;
    statusElement.classList.toggle("error", isError);
  }

  async function handOffOAuthCallback() {
    const query = new URLSearchParams(window.location.search);

    const payload = {
      type: "BLUESKY_OAUTH_CALLBACK",
      code: query.get("code"),
      state: query.get("state"),
      error: query.get("error"),
      errorDescription: query.get("error_description")
    };

    console.log("OAuth callback page loaded:", {
      url: window.location.href,
      origin: window.location.origin,
      hasChrome: Boolean(globalThis.chrome),
      hasRuntime: Boolean(globalThis.chrome?.runtime),
      hasSendMessage: typeof globalThis.chrome?.runtime?.sendMessage
    });

    if (payload.error) {
      setStatus(
        `Bluesky sign-in was not completed: ${
          payload.errorDescription || payload.error
        }`,
        true
      );
      return;
    }

    if (!payload.code || !payload.state) {
      setStatus(
        "The sign-in response was incomplete. Return to the extension and try again.",
        true
      );
      return;
    }

    if (typeof globalThis.chrome?.runtime?.sendMessage !== "function") {
      setStatus(
        "The extension could not be reached. Confirm its externally_connectable " +
        "match rule includes this exact GitHub Pages URL, reload the extension, " +
        "then reload this page.",
        true
      );
      return;
    }

    try {
      const response = await chrome.runtime.sendMessage(
        EXTENSION_ID,
        {
          type: "BLUESKY_OAUTH_CALLBACK",
          payload
        }
      );

      if (!response?.ok) {
        throw new Error(response?.error || "The extension rejected the callback.");
      }

      setStatus(
        "Bluesky sign-in was returned to the extension. You can close this tab."
      );
    } catch (error) {
      console.error("Could not hand off OAuth callback:", error);

      setStatus(
        `Could not return sign-in data to the extension: ${error.message}`,
        true
      );
    }
  }

  handOffOAuthCallback();
</script>
  </body>
</html>
